<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1330" viewBox="0 0 2160 1330" role="img" aria-labelledby="title desc">
<title id="title">Cluster 当前计算流水线</title>
<desc id="desc">依据 e737282 版本 RTL。三通道独立握手；SingleMacro 输入 C0、CSA C1、CPA 结果 C2。1/2、4、8 路归约分别在 C3、C4、C5 写 tmp，Psum 再晚一拍。51 bit 配置随每笔事务逐级对齐。</desc>
