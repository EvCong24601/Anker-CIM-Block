<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="1070" viewBox="0 0 2040 1070" role="img"><title>A3 / A4 交接的输入归属与两拍 Macro</title>
<defs><marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#486271"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#17394a}.title{font-size:36px;font-weight:700}.sub{font-size:18px}.head{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.mono{font:17px Consolas,"Microsoft YaHei",monospace}.stage{font:600 17px Consolas,"Microsoft YaHei",monospace}.dff{fill:#eaf3f8;stroke:#386885;stroke-width:1.7}.comb{fill:#fafbfa;stroke:#657a82;stroke-width:1.7;stroke-dasharray:6 4}.cell{fill:#eff4f7}.write{fill:#e3f3ed}.psum{fill:#fbefdb}.sample{fill:#dcebe5}.panel{fill:#fafcfc;stroke:#d5dfe4}.data{fill:none;stroke:#486271;stroke-width:2}.rule{stroke:#d5dfe4;stroke-width:1}</style>
<rect width="2040" height="1070" fill="white"/>
<text x="40" y="55" class="title" text-anchor="start">A3 / A4 交接的输入归属与两拍 Macro</text>
<text x="40" y="94" class="sub" text-anchor="start">同一条三通道通路的三个真实采样沿；外部 payload 归属按各路剩余输入数量独立判定。W4A4、两路归约、TMP 模式。</text>
<line x1="40" y1="118" x2="2000" y2="118" class="rule"/>
<rect x="40" y="145" width="626" height="739" rx="4" class="panel"/>
<text x="60" y="183" class="title" text-anchor="start">C138</text>
<text x="180" y="181" class="head" text-anchor="start">A3 发射，同时接收 A4 cmd</text>
<text x="60" y="233" class="stage" text-anchor="start">CMD</text>
<text x="160" y="233" class="body" text-anchor="start">A4 · valid/ready = 1/1</text>
<text x="60" y="278" class="stage" text-anchor="start">ACT</text>
<text x="160" y="278" class="body" text-anchor="start">无 ACT · 0/1</text>
<text x="60" y="323" class="stage" text-anchor="start">weight</text>
<text x="160" y="323" class="body" text-anchor="start">A3 地址 0x02 · 1/1</text>
<rect x="60" y="356" width="586" height="78" rx="4" class="comb"/>
<text x="73" y="383" class="head" text-anchor="start">ACT / 地址选择</text>
<text x="73" y="409" class="small" text-anchor="start">当前 ACT 缓冲 → A3；权重地址直通 → A3</text>
<path d="M353 434 H353 V467" class="data" marker-end="url(#a)"/>
<rect x="60" y="469" width="586" height="73" rx="4" class="comb"/>
<text x="73" y="496" class="head" text-anchor="start">issue 与输入所有权</text>
<text x="73" y="522" class="small" text-anchor="start">issue = 1 · 使用旧任务 A3 配置</text>
<path d="M353 542 H353 V575" class="data" marker-end="url(#a)"/>
<rect x="60" y="577" width="586" height="73" rx="4" class="dff"/>
<text x="73" y="604" class="head" text-anchor="start">Macro 输入边界</text>
<text x="73" y="630" class="small" text-anchor="start">A3：捕获 ACT，刷新 SRAM 行</text>
<rect x="60" y="673" width="586" height="73" rx="4" class="dff"/>
<text x="73" y="700" class="head" text-anchor="start">在途事务</text>
<text x="73" y="726" class="small" text-anchor="start">A2：CPA 结果已在 C137 保存</text>
<text x="60" y="786" class="small" text-anchor="start">A4 cmd 在本沿接收，沿后成为前端任务。</text>
<text x="60" y="817" class="small" text-anchor="start">该路 weight 最后一个 beat 仍属于 A3。</text>
<text x="60" y="848" class="small" text-anchor="start">A4 自己的地址要到下一沿才能接收。</text>
<rect x="706" y="145" width="626" height="739" rx="4" class="panel"/>
<text x="726" y="183" class="title" text-anchor="start">C139</text>
<text x="846" y="181" class="head" text-anchor="start">A4 收地址，A3 写 CSA</text>
<text x="726" y="233" class="stage" text-anchor="start">CMD</text>
<text x="826" y="233" class="body" text-anchor="start">无 cmd · 0/0</text>
<text x="726" y="278" class="stage" text-anchor="start">ACT</text>
<text x="826" y="278" class="body" text-anchor="start">无 ACT · 0/1</text>
<text x="726" y="323" class="stage" text-anchor="start">weight</text>
<text x="826" y="323" class="body" text-anchor="start">A4 地址 0x03 · 1/1</text>
<rect x="726" y="356" width="586" height="78" rx="4" class="comb"/>
<text x="739" y="383" class="head" text-anchor="start">ACT / 地址选择</text>
<text x="739" y="409" class="small" text-anchor="start">没有 A4 ACT → 等待；A4 地址写入标量缓冲</text>
<path d="M1019 434 H1019 V467" class="data" marker-end="url(#a)"/>
<rect x="726" y="469" width="586" height="73" rx="4" class="comb"/>
<text x="739" y="496" class="head" text-anchor="start">issue 与输入所有权</text>
<text x="739" y="522" class="small" text-anchor="start">issue = 0 · 前端等待 ACT</text>
<path d="M1019 542 H1019 V575" class="data" marker-end="url(#a)"/>
<rect x="726" y="577" width="586" height="73" rx="4" class="dff"/>
<text x="739" y="604" class="head" text-anchor="start">Macro 输入边界</text>
<text x="739" y="630" class="small" text-anchor="start">无新 Macro 输入，SRAM 保持</text>
<rect x="726" y="673" width="586" height="73" rx="4" class="dff"/>
<text x="739" y="700" class="head" text-anchor="start">在途事务</text>
<text x="739" y="726" class="small" text-anchor="start">A3：CSA 暂存；C140 才写 Macro 结果</text>
<text x="726" y="786" class="small" text-anchor="start">A4 地址沿后有效，weight_available = 1。</text>
<text x="726" y="817" class="small" text-anchor="start">A3 配置继续随自身 metadata 推进。</text>
<text x="726" y="848" class="small" text-anchor="start">A3 在 C141 写 tmp，C142 被下游采样。</text>
<rect x="1372" y="145" width="626" height="739" rx="4" class="panel"/>
<text x="1392" y="183" class="title" text-anchor="start">C142</text>
<text x="1512" y="181" class="head" text-anchor="start">A4 ACT 直通并发射</text>
<text x="1392" y="233" class="stage" text-anchor="start">CMD</text>
<text x="1492" y="233" class="body" text-anchor="start">无 cmd · 0/1</text>
<text x="1392" y="278" class="stage" text-anchor="start">ACT</text>
<text x="1492" y="278" class="body" text-anchor="start">A4 ACT · 1/1</text>
<text x="1392" y="323" class="stage" text-anchor="start">weight</text>
<text x="1492" y="323" class="body" text-anchor="start">无新地址 · 0/0</text>
<rect x="1392" y="356" width="586" height="78" rx="4" class="comb"/>
<text x="1405" y="383" class="head" text-anchor="start">ACT / 地址选择</text>
<text x="1405" y="409" class="small" text-anchor="start">当前 ACT 直通 → A4；已缓冲地址 0x03 → A4</text>
<path d="M1685 434 H1685 V467" class="data" marker-end="url(#a)"/>
<rect x="1392" y="469" width="586" height="73" rx="4" class="comb"/>
<text x="1405" y="496" class="head" text-anchor="start">issue 与输入所有权</text>
<text x="1405" y="522" class="small" text-anchor="start">issue = 1 · 两路操作数齐备</text>
<path d="M1685 542 H1685 V575" class="data" marker-end="url(#a)"/>
<rect x="1392" y="577" width="586" height="73" rx="4" class="dff"/>
<text x="1405" y="604" class="head" text-anchor="start">Macro 输入边界</text>
<text x="1405" y="630" class="small" text-anchor="start">A4：捕获 ACT，刷新 SRAM 行</text>
<rect x="1392" y="673" width="586" height="73" rx="4" class="dff"/>
<text x="1405" y="700" class="head" text-anchor="start">在途事务</text>
<text x="1405" y="726" class="small" text-anchor="start">A3：本沿采样最终 raw 结果</text>
<text x="1392" y="786" class="small" text-anchor="start">A4 ACT 在同沿用完：act_buffer_we = 0。</text>
<text x="1392" y="817" class="small" text-anchor="start">W4 的 Macro ACT bank 时钟为 011。</text>
<text x="1392" y="848" class="small" text-anchor="start">A4 在 C143 写 CSA，C144 写 Macro 结果。</text>
<text x="40" y="934" class="body" text-anchor="start">配置随数据推进：51 bit cfg = split + Macro enable + OC mask + last_phase + accum_mode；切换前端任务不会改写旧事务的解释。</text>
<text x="40" y="974" class="body" text-anchor="start">最终发布：A3 在 C141 写 tmp / C142 采样；A4 在 C145 写 tmp / C146 采样。C146 可同时接收不兼容 B1 cmd。</text>
<text x="40" y="1014" class="small" text-anchor="start">本图为采样沿快照；写入后的状态属于该沿之后。数值与完整握手见实测交接图和 timing_data CSV。</text>
<text x="2000" y="1052" class="small" text-anchor="end">RTL e737282 · 2026-11-17 · CSA arithmetic golden</text>
</svg>
